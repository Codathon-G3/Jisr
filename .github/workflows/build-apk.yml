name: Build & Package Android APK

on:
  push:
    branches:
      - main
      - feat/apk-mobile-sync
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
      - feat/apk-mobile-sync
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish release asset on GitHub Releases'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Safety & Mobile Config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci || npm install --legacy-peer-deps

      - name: Validate Configurations (app.json, eas.json, package.json, tsconfig.json, babel.config.js)
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json', 'utf8')); console.log('✓ package.json valid');"
          node -e "JSON.parse(require('fs').readFileSync('app.json', 'utf8')); console.log('✓ app.json valid');"
          node -e "JSON.parse(require('fs').readFileSync('eas.json', 'utf8')); console.log('✓ eas.json valid');"
          node -e "JSON.parse(require('fs').readFileSync('tsconfig.json', 'utf8')); console.log('✓ tsconfig.json valid');"
          node -e "require('./babel.config.js'); console.log('✓ babel.config.js valid');"

      - name: Run Guardian Safety Selftest (450 unit tests)
        run: node safety/selftest.mjs

      - name: Run Guardian Crisis Benchmark Evaluation
        run: node safety/evaluate.mjs safety/dev-set.json

      - name: Run App, Privacy, Parity & Trust Tests
        run: npm test

  backend-tests:
    name: Backend Tests (FastAPI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        run: pip install -r backend/requirements.txt

      - name: Run Backend Tests
        working-directory: backend
        env:
          GEMINI_API_KEY: ''
          REQUIRE_SAFETY_DIR: '1'
        run: python -m pytest -q

  build-apk:
    name: Build Standalone Android APK
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Ordinary pushes and PRs only check that the APK builds, so one ABI is enough and much
      # faster on the 2-core runners. Releases build the same three ABIs as builds/jisr-v1.0.0.apk.
      ABIS: ${{ (startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true') && 'arm64-v8a,armeabi-v7a,x86_64' || 'arm64-v8a' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # No setup-android action: it failed while accepting licences, and the ubuntu-latest image
      # already has the Android SDK (ANDROID_HOME) with licences accepted. Gradle downloads any
      # missing platform, build-tools or NDK version itself.
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/licenses" && ls "$ANDROID_HOME/licenses"

      - name: Install Dependencies
        run: |
          npm ci || npm install --legacy-peer-deps

      - name: Build Android Release APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          mkdir -p builds
          echo "Starting genuine compilation of Android APK for package com.ai4ly.jisr..."

          if [ -n "$EXPO_TOKEN" ]; then
            echo "Building via EAS CLI (profile: preview)..."
            npm install -g eas-cli
            eas build --platform android --profile preview --local --non-interactive --output builds/jisr-v1.0.0.apk
          else
            echo "Assembling standalone release APK via Expo prebuild and Gradle..."
            npx expo prebuild --platform android --clean
            cd android
            chmod +x gradlew
            ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures="$ABIS"
            cd ..
            APK_FILE=$(find android/app/build/outputs/apk/ -name "*.apk" | head -n 1)
            if [ -n "$APK_FILE" ]; then
              cp "$APK_FILE" builds/jisr-v1.0.0.apk
              echo "✓ Copied $APK_FILE to builds/jisr-v1.0.0.apk"
            else
              echo "Error: Gradle did not produce an APK artifact!"
              exit 1
            fi
          fi

      - name: Compute SHA-256 Checksum
        run: |
          if [ ! -f "builds/jisr-v1.0.0.apk" ]; then
            echo "Error: Expected APK artifact at builds/jisr-v1.0.0.apk was not found!"
            exit 1
          fi
          sha256sum builds/jisr-v1.0.0.apk > builds/jisr-v1.0.0.apk.sha256
          echo "✓ SHA-256 Checksum generated:"
          cat builds/jisr-v1.0.0.apk.sha256

      - name: Upload APK Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jisr-v1.0.0-apk
          path: |
            builds/jisr-v1.0.0.apk
            builds/jisr-v1.0.0.apk.sha256
            builds/README.md
          if-no-files-found: error
          retention-days: 30

      - name: Publish Release Asset to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            builds/jisr-v1.0.0.apk
            builds/jisr-v1.0.0.apk.sha256
          name: "Jisr Android Release ${{ github.ref_name }}"
          body: |
            ## Jisr (جِسر) Android Release
            - **Package**: `com.ai4ly.jisr`
            - **Target Platform**: Android 7.0+ (API Level 24+)
            - **Build Profile**: Preview standalone APK
            - **Architecture**: React Native 0.74 / Expo SDK 51
            - **Privacy Guarantee**: Zero telemetry, on-device sandboxed storage, Guardian Crisis Interception.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
