services:
  - type: web
    name: jisr-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_MODEL
        value: gemini-flash-lite-latest
      - key: LLM_TIMEOUT_SECONDS
        value: "10"
      - key: CORS_ORIGINS
        value: http://localhost:3000
      - key: GEMINI_API_KEY
        sync: false
