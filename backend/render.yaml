services:
  - type: web
    name: jisr-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    # --no-access-log: uvicorn's own access log records the caller's IP address.
    # The app logs only path, status and timing (app/logging_setup.py).
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --no-access-log
    envVars:
      - key: GEMINI_MODEL
        value: gemini-flash-lite-latest
      - key: LLM_TIMEOUT_SECONDS
        value: "10"
      - key: CORS_ORIGINS
        value: "*"
      - key: GEMINI_API_KEY
        sync: false
